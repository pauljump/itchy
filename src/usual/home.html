<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Usual — Help ChatGPT get to know you</title>
<style>
:root{--paper:#f8f5ef;--ink:#2b352e;--muted:#61685f;--line:#d9dcd1;--green:#344e40;--pale:#eaf0e5;--clay:#a74d32;--white:#fffefb}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:18px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea{font:inherit}button,a,input,textarea{touch-action:manipulation}button{cursor:pointer}a{color:var(--green);text-underline-offset:4px}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--clay);outline-offset:5px}button:disabled{cursor:wait;opacity:.65}h1,h2,h3,p{margin:0}h1,h2{font-family:Georgia,"Times New Roman",serif;font-weight:400;line-height:1.12;letter-spacing:-1.5px}h1{font-size:clamp(42px,5.7vw,72px)}h2{font-size:clamp(34px,4.5vw,48px)}h3{font-size:21px;line-height:1.4}p{margin-top:18px}.muted{color:var(--muted)}.small{font-size:15px}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:12px;font-weight:700;color:var(--clay);margin:0 0 22px}.shell{max-width:1152px;margin:auto;padding:0 40px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:28px 0;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px;font:600 25px Georgia,serif;letter-spacing:-.6px;background:none;border:0;color:var(--ink);padding:0;min-height:44px}.mark{width:30px;height:30px}.header-note{font-size:14px;color:var(--muted)}main{min-height:70vh;padding:64px 0 70px}footer{padding:24px 0 32px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:18px;font-size:13px;color:var(--muted)}.hero{display:grid;grid-template-columns:1.15fr 1fr;align-items:center;gap:80px}.hero p.lead{max-width:520px;font-size:20px;margin:25px 0 30px}.btn{display:inline-flex;justify-content:center;align-items:center;gap:14px;min-height:54px;border:1px solid var(--green);border-radius:9px;padding:12px 23px;background:var(--green);color:white;font-weight:600;text-decoration:none;line-height:1.4}.btn:hover{background:#253d30}.secondary{background:transparent;color:var(--green)}.secondary:hover{background:var(--pale)}.text-btn{border:0;background:none;color:var(--green);padding:10px 2px;min-height:44px;text-decoration:underline;text-underline-offset:5px}.hero-aside{position:relative;padding:24px 0}.example{background:var(--white);padding:30px;border:1px solid var(--line);border-radius:16px;box-shadow:0 16px 45px #2b352e08}.example .label{font-size:12px;text-transform:uppercase;letter-spacing:1.6px;font-weight:700}.bubble{border-radius:12px;padding:18px 20px;font-size:17px;line-height:1.6;margin-top:18px;background:#f0eee8}.bubble.personal{background:var(--pale)}.bubble p{margin:8px 0 0}.note{margin:20px 0 0 26px;padding:20px 22px;border-left:3px solid #bca17a;color:#625742;font-family:Georgia,serif;font-size:21px}.steps{margin-top:65px;padding-top:28px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);gap:35px}.step{display:flex;gap:14px}.step-number{color:var(--clay);font:24px Georgia,serif}.step p{font-size:15px;margin:4px 0 0;color:var(--muted)}.center{max-width:700px;margin:0 auto}.center.wide{max-width:810px}.progress{display:flex;gap:8px;margin-bottom:26px}.progress span{height:4px;flex:1;background:var(--line);border-radius:4px}.progress .done{background:var(--green)}.intro{margin:16px 0 28px;color:var(--muted)}.choices{display:grid;gap:12px;margin:26px 0 20px}.choice{min-height:68px;display:flex;align-items:center;gap:17px;width:100%;padding:16px 20px;text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--white);color:var(--ink)}.choice:hover{border-color:var(--green)}.choice.selected{border:2px solid var(--green);padding:15px 19px;background:var(--pale)}.radio{height:20px;width:20px;flex-shrink:0;border:1px solid #8b9487;border-radius:50%}.selected .radio{border:6px solid var(--green);background:white}label{display:block;font-size:16px;margin-bottom:7px}input,textarea{display:block;width:100%;border:1px solid #929b8d;border-radius:8px;background:var(--white);padding:13px;color:var(--ink)}textarea{resize:vertical;min-height:95px}details{margin:24px 0}summary{cursor:pointer;color:var(--green);min-height:44px;padding:6px 0}.details-body{padding:12px 0;color:var(--muted);font-size:16px}.actions{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:30px;flex-wrap:wrap}.actions.start{justify-content:flex-start}.error{color:#963626;background:#fbece6;border-radius:8px;padding:12px 16px;margin-top:16px}.preference{background:var(--white);padding:23px 25px;border:1px solid var(--line);border-radius:12px;margin:16px 0}.preference .top{display:flex;justify-content:space-between;align-items:start;gap:20px}.preference .top p{margin:0}.preference .context{font-size:14px;color:var(--muted);margin-bottom:8px}.preference .controls{display:flex;gap:18px;margin-top:10px}.preference .controls button{font-size:15px}.callout{padding:18px 22px;background:var(--pale);border-radius:10px;font-size:16px;margin-top:24px}.check{display:inline-flex;justify-content:center;align-items:center;width:42px;height:42px;border-radius:50%;background:var(--pale);margin-bottom:20px}.transfer{display:grid;gap:23px;margin:26px 0}.transfer-step{display:flex;gap:17px}.transfer-step .number{display:flex;align-items:center;justify-content:center;flex-shrink:0;width:31px;height:31px;background:var(--pale);border-radius:50%;font-size:15px}.transfer-step p{font-size:16px;margin-top:5px}.note-area{font-size:16px;line-height:1.65;min-height:290px}.empty{text-align:center;padding:30px 0}.status{font-size:15px;color:var(--green);min-height:25px;margin-top:12px}#global-status:empty{display:none}.inline-link{font-size:15px}dialog{border:1px solid var(--line);border-radius:14px;padding:30px;background:var(--paper);color:var(--ink);max-width:480px;width:calc(100% - 40px)}dialog::backdrop{background:#21312766}dialog h2{font-size:32px}
@media(max-width:760px){.shell{padding:0 22px}header{padding:18px 0}.header-note{font-size:12px}main{padding:38px 0 46px}.hero{grid-template-columns:1fr;gap:28px}.hero-aside{padding:0}.hero p.lead{font-size:18px}.steps{grid-template-columns:1fr;gap:24px;margin-top:35px}.example{padding:24px}.note{margin-left:8px}.btn{padding:13px 18px}.actions>.btn{flex-grow:1}footer{flex-wrap:wrap}.preference{padding:19px}.eyebrow{margin-bottom:16px}.brand{font-size:23px}}
@media(prefers-reduced-motion:no-preference){main{animation:appear .25s ease-out}@keyframes appear{from{opacity:.4;transform:translateY(5px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<div class="shell">
<header><button class="brand" data-action="home" aria-label="Usual home"><svg class="mark" viewBox="0 0 36 36" fill="none" aria-hidden="true"><path d="M5 25L12 8H22L30 25L22 29H12Z" fill="#344e40"/><path d="M12 8L17 25L22 29M17 25L30 25" stroke="#f8f5ef" stroke-width="1.5"/></svg>Usual</button><span class="header-note">A little more you.</span></header>
<main id="app" aria-busy="true"><div class="center"><h1>Welcome to Usual.</h1><p>Getting things ready…</p></div></main>
<div id="global-status" class="status" role="status" aria-live="polite"></div>
<footer><span>Your preferences. Yours to change.</span><span>Local preview · <a href="/studio">Developer tools</a></span></footer>
</div>
<dialog id="forget-dialog"><h2>Forget these preferences?</h2><p>This removes your saved Usual preferences from this browser. Copies you’ve taken elsewhere stay there.</p><div class="actions"><button class="btn secondary" data-action="cancel-forget">Keep them</button><button class="btn" data-action="confirm-forget">Forget preferences</button></div></dialog>
<script>
'use strict';
const KEY='usual.consumer.v1';
const app=document.getElementById('app');
let questions=[],saved=[],draft={},prepared=[],index=0,screen='home',editing=false,busy=false,storageProblem=false;
const escapeHtml=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const button=(action,label,kind='btn',extra='')=>`<button class="${kind}" data-action="${action}" ${extra}>${label}</button>`;
const questionFor=id=>questions.find(q=>q.id===id);
function announce(text){document.getElementById('global-status').textContent=text;}
function display(html,focus=true){app.innerHTML=html;app.setAttribute('aria-busy','false');if(focus){const heading=app.querySelector('h1,h2');if(heading){heading.tabIndex=-1;heading.focus({preventScroll:true});}window.scrollTo(0,0);}announce('');}
async function request(url,body){const res=await fetch(url,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});if(!res.ok)throw new Error('We couldn’t prepare your preferences. Please try again.');return res.json();}
function readSaved(){try{const data=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(data))throw Error();saved=data.filter(e=>e&&typeof e.id==='string'&&questionFor(e.id)&&typeof e.call==='string'&&e.call.length<=500&&Array.isArray(e.reasons)&&e.reasons.every(r=>typeof r==='string'));}catch{saved=[];storageProblem=true;}}
function persist(entries){try{localStorage.setItem(KEY,JSON.stringify(entries));storageProblem=false;return true;}catch{storageProblem=true;return false;}}
function home(){screen='home';if(saved.length){dashboard();return;}display(`<div class="hero"><div><p class="eyebrow">Meet your Usual</p><h1>Help ChatGPT<br>get to know you.</h1><p class="lead">Tell Usual a little about what you like. Get a simple note to share with ChatGPT, so its suggestions fit your life.</p>${button('start','Let’s make it yours <span aria-hidden="true">→</span>')}<p class="small muted">Three easy questions. No account needed.</p></div><div class="hero-aside"><div class="example"><div class="label muted">Here’s the idea</div><div class="bubble"><div class="label">You tell Usual</div><p>“I like days out with time to relax.”</p></div><div class="bubble personal"><div class="label">An example after sharing your note</div><p>“Let’s plan one lovely stop and lunch nearby. We’ll leave the afternoon open.”</p></div><p class="small muted">A small example of what your preferences can change.</p></div><div class="note">The little things shouldn’t need<br>explaining every time.</div></div></div><div class="steps"><div class="step"><span class="step-number">01</span><div><strong>Tell it what you like</strong><p>A few ordinary choices. In your own words, if you prefer.</p></div></div><div class="step"><span class="step-number">02</span><div><strong>Check it sounds like you</strong><p>See exactly what gets saved. Change anything.</p></div></div><div class="step"><span class="step-number">03</span><div><strong>Take it to ChatGPT</strong><p>Copy your note into a conversation when you want to use it.</p></div></div>`);}
function start(){draft=Object.fromEntries(saved.map(e=>[e.id,{call:e.call,reason:e.reasons.join(' ')}]));index=0;editing=false;showQuestion();}
function showQuestion(){screen='question';const q=questions[index],answer=draft[q.id]||{call:'',reason:''};const custom=answer.call&&!q.options.includes(answer.call);display(`<div class="center"><div class="progress" aria-label="Question ${index+1} of ${questions.length}">${questions.map((_,i)=>`<span class="${i<=index?'done':''}"></span>`).join('')}</div><p class="eyebrow">${index+1} of ${questions.length} · ${escapeHtml(q.label)}</p><h1 style="font-size:clamp(34px,4vw,46px)">${escapeHtml(q.question)}</h1><p class="intro">${escapeHtml(q.hint)}</p><div class="choices" role="group" aria-label="Choose an answer">${q.options.map((option,i)=>`<button class="choice ${option===answer.call?'selected':''}" aria-pressed="${option===answer.call}" data-action="choose" data-index="${i}"><span class="radio" aria-hidden="true"></span>${escapeHtml(option)}</button>`).join('')}<button class="choice ${custom?'selected':''}" aria-pressed="${!!custom}" data-action="custom"><span class="radio" aria-hidden="true"></span>I’d put it another way</button></div><div id="custom-wrap" ${custom?'':'hidden'}><label for="custom-answer">How would you put it?</label><input id="custom-answer" maxlength="500" value="${custom?escapeHtml(answer.call):''}" placeholder="It depends, or something else…"></div><details ${answer.reason?'open':''}><summary>Anything else that matters? <span class="small">(optional)</span></summary><label for="reason" class="small">For example, when would you choose differently?</label><textarea id="reason" maxlength="500" rows="2">${escapeHtml(answer.reason)}</textarea></details><div id="question-error" role="alert"></div><div class="actions">${button('back','← Back','text-btn')}${button('next',editing?'Review my change':index===questions.length-1?'See my preferences →':'Continue →')}</div><div style="text-align:center;margin-top:16px">${button('skip','Skip this question','text-btn small')}</div><p class="small muted">Only what you choose to share. You’ll review it before saving.</p></div>`);}
function capture(){const q=questions[index];const custom=document.getElementById('custom-wrap');let call=draft[q.id]?.call||'';if(!custom.hidden)call=document.getElementById('custom-answer').value.trim();const reason=document.getElementById('reason').value.trim();if(call)draft[q.id]={call,reason};else delete draft[q.id];return !!call;}
async function prepare(){if(!Object.keys(draft).length){screen='empty';display(`<div class="center empty"><h2>No rush.</h2><p>One answer is enough to start. You can leave the other questions for later.</p><div class="actions start">${button('start','Answer a question')}${button('home','Back to the beginning','text-btn')}</div></div>`);return;}busy=true;app.querySelectorAll('button').forEach(b=>b.disabled=true);try{const result=await request('/api/onboarding/prepare',{answers:questions.filter(q=>draft[q.id]).map(q=>({id:q.id,...draft[q.id]}))});prepared=result.entries;draft=Object.fromEntries(prepared.map(e=>[e.id,{call:e.call,reason:e.reasons.join(' ')}]));showReview();}catch(error){announce(error.message);app.querySelectorAll('button').forEach(b=>b.disabled=false);}finally{busy=false;}}
function cards(entries){return entries.map(e=>`<article class="preference"><div class="context">${escapeHtml(questionFor(e.id).label)}</div><p style="margin:0"><strong>${escapeHtml(e.call)}</strong></p>${e.reasons.length?`<p class="small muted">${escapeHtml(e.reasons.join(' '))}</p>`:''}<div class="controls">${button('edit','Change','text-btn',`data-id="${e.id}"`)}${button('remove','Remove','text-btn',`data-id="${e.id}"`)}</div></article>`).join('');}
function showReview(){screen='review';display(`<div class="center"><p class="eyebrow">A little about you</p><h1 style="font-size:48px">Does this sound like you?</h1><p class="intro">These are your answers, not guesses about you. Change anything before saving.</p>${cards(prepared)}${prepared.length?`<div class="callout">Saved in this browser on this device. Nothing is sent to ChatGPT until you take it there. Anyone using this browser profile can see it.</div><div class="actions">${button('questions','Back to questions','text-btn')}${button('save','Yes, save my preferences →')}</div>`:`<p>You’ve removed all your answers.</p>${button('start','Try a question')}`}<details><summary>Where do my answers go?</summary><div class="details-body">Usual sends your answers to its server to check for common secrets, then returns them for review. The server does not save your answers. It doesn’t call an AI service. Only answers you save stay in this browser. They aren’t synced to other devices, and clearing browser data removes them. The check can miss sensitive details; review your note before sharing.</div></details></div>`);}
function exampleFor(entry){const q=questionFor(entry.id),i=q.options.indexOf(entry.call);return i>=0?{request:q.example_request,response:q.examples[i],reason:entry.call}:null;}
function dashboard(){screen='dashboard';const example=saved.map(exampleFor).find(Boolean);display(`<div class="center wide"><span class="check" aria-hidden="true">✓</span><p class="eyebrow">Your Usual</p><h1 style="font-size:48px">A small start.<br>A little more you.</h1><p class="intro">${saved.length} ${saved.length===1?'preference':'preferences'} ${storageProblem?'ready for this visit':'saved in this browser'}. You can change your mind whenever you like.</p>${storageProblem?'<p class="error" role="alert">This browser couldn’t save your preferences. Copy or download your note before closing this page.</p>':''}${example?`<div class="example"><div class="label muted">See what a difference one answer could make</div><div class="bubble"><div class="label">You ask</div><p>${escapeHtml(example.request)}</p></div><div class="bubble personal"><div class="label">An example using your preference</div><p>${escapeHtml(example.response)}</p></div><p class="small muted">Based on “${escapeHtml(example.reason)}”. This keeps the focus on what you chose, without adding details you didn’t provide.</p></div>`:'<div class="callout">You used your own words. Your note will pass them along exactly, so ChatGPT can use them in your next conversation.</div>'}<div class="actions start">${button('handoff','Use my note in ChatGPT →')}${button('download','Download my note','text-btn')}</div><p class="small muted">You’ll see the note before you share it. No automatic connection yet.</p><div style="margin-top:42px"><h2 style="font-size:32px">What you’ve told Usual</h2>${cards(saved)}</div>${saved.length<questions.length?button('start','Tell it a little more','text-btn'):''}<details><summary>Your preferences and privacy</summary><div class="details-body">These preferences stay in this browser profile. They are separate from the developer tools and aren’t shared with an AI automatically. Copying your note into another service shares it with that service. Removing it here won’t remove copies elsewhere.</div>${button('forget','Forget my preferences','text-btn')}</details></div>`);}
function noteText(){return ['Here are a few preferences I chose with Usual. Use them when they are relevant to this conversation. These are starting points, not rules for every situation. If I give you different instructions now, follow those. Ask me when something important is unknown. A preference is not permission to spend money or act on my behalf.','',...saved.map(e=>`${e.situation}: ${e.call}.${e.reasons.length?' Extra context: '+e.reasons.join(' '):''}`),'','If I correct one of these, help me put the change into words so I can update my Usual note. This note does not sync automatically.','','Now help me with: [write what you would like help with]'].join('\n');}
function handoff(){screen='handoff';display(`<div class="center"><p class="eyebrow">Bring your preferences along</p><h1 style="font-size:48px">Try it in a conversation.</h1><p class="intro">You’ll copy this note and paste it into ChatGPT. That’s how it gets to know these preferences.</p><div class="transfer"><div class="transfer-step"><span class="number">1</span><div><strong>Read your note, then copy it.</strong><p>Only the words below will be copied.</p></div></div></div><label for="share-note">Your note to ChatGPT</label><textarea class="note-area" id="share-note" readonly>${escapeHtml(noteText())}</textarea><div class="actions start">${button('copy','Copy my note')}${button('download','Download instead','text-btn')}</div><div class="status" id="copy-status" role="status" aria-live="polite"></div><div class="transfer"><div class="transfer-step"><span class="number">2</span><div><strong>Open ChatGPT and paste your note.</strong><p>Use the message box in a conversation. Add what you’d like help with at the end, then send.</p><a class="btn secondary" href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer" style="margin-top:14px">Open ChatGPT <span aria-hidden="true">↗</span></a></div></div><div class="transfer-step"><span class="number">3</span><div><strong>See how it feels.</strong><p>If something isn’t quite you, come back and change your preferences. Copy a fresh note after making changes.</p></div></div></div><div class="callout">This shares your note with ChatGPT when you paste and send it. It doesn’t connect your accounts or update future conversations automatically.</div><div class="actions">${button('dashboard','← Back to my Usual','text-btn')}</div></div>`);}
async function act(action,target){if(busy)return;switch(action){
case 'home':home();break;
case 'start':start();break;
case 'questions':index=0;editing=false;showQuestion();break;
case 'choose':{const q=questions[index];draft[q.id]={call:q.options[Number(target.dataset.index)],reason:document.getElementById('reason').value};showQuestion();app.querySelector(`[data-index="${target.dataset.index}"]`).focus();break;}
case 'custom':{document.getElementById('custom-wrap').hidden=false;app.querySelectorAll('.choice').forEach(b=>{b.classList.toggle('selected',b===target);b.setAttribute('aria-pressed',String(b===target));});document.getElementById('custom-answer').focus();break;}
case 'next':if(!capture()){document.getElementById('question-error').className='error';document.getElementById('question-error').textContent='Choose an answer, write your own, or skip this question.';break;}if(editing||index===questions.length-1)await prepare();else{index++;showQuestion();}break;
case 'skip':delete draft[questions[index].id];if(editing||index===questions.length-1)await prepare();else{index++;showQuestion();}break;
case 'back':capture();if(editing)await prepare();else if(index){index--;showQuestion();}else home();break;
case 'edit':{const entries=screen==='review'?prepared:saved;draft=Object.fromEntries(entries.map(e=>[e.id,{call:e.call,reason:e.reasons.join(' ')}]));index=questions.findIndex(q=>q.id===target.dataset.id);editing=true;showQuestion();break;}
case 'remove':if(screen==='review'){prepared=prepared.filter(e=>e.id!==target.dataset.id);delete draft[target.dataset.id];showReview();}else{const next=saved.filter(e=>e.id!==target.dataset.id);if(!persist(next)){announce('Couldn’t update browser storage. Your saved preferences haven’t changed.');break;}saved=next;if(saved.length)dashboard();else home();}break;
case 'save':saved=prepared.slice();persist(saved);dashboard();break;
case 'dashboard':dashboard();break;
case 'handoff':handoff();break;
case 'copy':try{await navigator.clipboard.writeText(noteText());document.getElementById('copy-status').textContent='Copied. Now open ChatGPT and paste your note into the message box.';}catch{const field=document.getElementById('share-note');field.focus();field.select();document.getElementById('copy-status').textContent='Copying wasn’t available. Your note is selected; use Copy from your device’s menu.';}break;
case 'download':{const url=URL.createObjectURL(new Blob([noteText()],{type:'text/plain;charset=utf-8'}));const link=document.createElement('a');link.href=url;link.download='My Usual note.txt';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);announce('Your note has been prepared for download.');break;}
case 'forget':document.getElementById('forget-dialog').showModal();break;
case 'cancel-forget':document.getElementById('forget-dialog').close();break;
case 'confirm-forget':try{localStorage.removeItem(KEY);saved=[];draft={};prepared=[];document.getElementById('forget-dialog').close();home();announce('Your saved preferences have been removed from this browser.');}catch{document.getElementById('forget-dialog').close();announce('Couldn’t remove browser storage. Try clearing this site’s data in your browser settings.');}break;
case 'retry':await init();break;
}}
document.addEventListener('click',event=>{const target=event.target.closest('[data-action]');if(target)act(target.dataset.action,target);});
async function init(){try{questions=await request('/api/onboarding/questions');readSaved();home();if(storageProblem)announce('Saved preferences couldn’t be loaded. You can still make a note for this visit.');}catch{display(`<div class="center"><h1>Let’s try that again.</h1><p>Usual couldn’t load its questions. Check your connection, then try again.</p><div class="actions start">${button('retry','Try again')}</div></div>`);}}
init();
</script>
</body>
</html>
